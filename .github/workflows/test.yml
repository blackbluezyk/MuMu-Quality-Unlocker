name: PowerShell regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified upstream tag
        with:
          persist-credentials: false
      - name: Isolated regression tests (no installed MuMu required)
        shell: ${{ matrix.shell }}
        run: ./tests/Run-All.ps1 -OutDirectory (Join-Path $env:RUNNER_TEMP 'mumu-tests')
